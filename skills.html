<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills - Kevin Bandong</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="site.css?v=5">
    <link rel="stylesheet" href="nav.css?v=11">
    <script src="nav.js?v=15" defer></script>
    <style>
        /* sunset box only as tall as the content (same as Home) */
        body.dark > .page { flex: 0 0 auto; padding-bottom: 36px; }
        body.dark > footer { margin-top: 0 !important; }

        .tabs {
            display: flex;
            gap: 4px;
            padding: 4px;
            margin-top: 6px;
            background: rgba(15, 23, 42, .75);
            border: 1px solid rgba(148, 163, 184, .16);
            border-radius: 12px;
        }
        .tab {
            flex: 1;
            padding: 10px 6px;
            border: 0;
            border-radius: 9px;
            background: transparent;
            color: var(--text);
            font: 600 .82rem 'Montserrat', system-ui, sans-serif;
            cursor: pointer;
            transition: background .2s ease, color .2s ease;
        }
        .tab.active { background: var(--accent); color: #fff; }

        /* tap a card -> it extends downward and shows its details */
        #skillGrid { align-items: start; }
        .acc { padding: 0; }
        .acc-head {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin: 0;
            padding: 16px 14px;
            border: 0;
            background: none;
            color: inherit;
            font: inherit;
            text-align: left;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .acc-head:focus-visible { outline: 2px solid var(--c); outline-offset: -3px; border-radius: 14px; }
        .acc-head .t {
            display: block;
            margin-top: 12px;
            color: var(--white);
            font-weight: 700;
            font-size: .98rem;
            line-height: 1.3;
        }
        @media (max-width: 560px) { .acc-head .t { min-height: 2.6em; } }   /* every closed card has the same height */
        .acc.open { box-shadow: 0 0 0 1px var(--c), 0 18px 40px -22px var(--c); }
        .acc.open { border-color: var(--c); }
        .panel {
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            transition: max-height .35s ease, opacity .3s ease;
        }
        .acc.open .panel { opacity: 1; }
        .panel ul { margin: 0; padding: 0 14px 16px 30px; font-size: .84rem; color: #CBD5E1; }
        .panel li { margin: 5px 0; }
        .panel li::marker { color: var(--c); }
        .tap-hint { margin: 14px 0 0; color: #64748B; font-size: .74rem; letter-spacing: .06em; }
    </style>
</head>
<body class="dark">

<section class="page">
    <div class="wrap">
        <p class="eyebrow-l">My Skills</p>
        <h1 class="title">Skills I'm Developing</h1>
        <p class="lead">Building the tools for a better tomorrow.</p>

        <div class="tabs" id="tabs">
            <button class="tab active" data-tab="technical">Technical</button>
            <button class="tab" data-tab="soft">Soft Skills</button>
            <button class="tab" data-tab="others">Others</button>
        </div>

        <p class="tap-hint">Tap a card to see more.</p>
        <div class="grid" id="skillGrid"></div>
    </div>
</section>

<footer>
    <p>&copy; 2026 Kevin Bandong. All rights reserved. &nbsp;<span class="tag">Better Code &middot; Brighter Future</span></p>
</footer>

<script>
/* edit your skills here: title, small text, icon, color */
const ICONS = {
    code:    '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
    monitor: '<rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>',
    db:      '<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>',
    file:    '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>',
    tool:    '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
    cpu:     '<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/>',
    mic:     '<path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/>',
    chat:    '<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>',
    users:   '<path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    clock:   '<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
    pen:     '<path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/>',
    book:    '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
    zap:     '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>'
};

const SKILLS = {
    technical: [
        { icon: 'code',    color: '#F97316', title: 'Programming',      text: 'Python, HTML, CSS, JavaScript, OOP' },
        { icon: 'monitor', color: '#38BDF8', title: 'Web Development',  text: 'Responsive Design, UI/UX Basics' },
        { icon: 'db',      color: '#A78BFA', title: 'Database',         text: 'MySQL, Database Management' },
        { icon: 'file',    color: '#94A3B8', title: 'MS Office',        text: 'Word, Excel, PowerPoint, Google Workspace' },
        { icon: 'tool',    color: '#F97316', title: 'Tools & Platforms', text: 'Git, VS Code, Pydroid, GitHub' },
        { icon: 'cpu',     color: '#38BDF8', title: 'Problem Solving',  text: 'Logical Thinking, Math & Algorithms' }
    ],
    soft: [
        { icon: 'mic',   color: '#F97316', title: 'Public Speaking', text: 'Sharing ideas with confidence' },
        { icon: 'chat',  color: '#38BDF8', title: 'Communication',   text: 'Clear and respectful with others' },
        { icon: 'users', color: '#A78BFA', title: 'Teamwork',        text: 'Working well in a group' },
        { icon: 'clock', color: '#94A3B8', title: 'Time Management', text: 'Planning and meeting deadlines' }
    ],
    others: [
        { icon: 'pen',  color: '#F97316', title: 'Graphic Design',  text: 'Layouts, posters and visuals' },
        { icon: 'book', color: '#38BDF8', title: 'Fast Learner',    text: 'Always learning something new' },
        { icon: 'zap',  color: '#A78BFA', title: 'Creativity',      text: 'Turning ideas into projects' }
    ]
};

const grid = document.getElementById('skillGrid');
const tabs = document.querySelectorAll('.tab');

function show(name) {
    grid.innerHTML = '';
    SKILLS[name].forEach(function (s) {
        var items = s.text.split(', ').map(function (x) { return '<li>' + x + '</li>'; }).join('');
        var d = document.createElement('div');
        d.className = 'card acc';
        d.style.setProperty('--c', s.color);
        d.innerHTML =
            '<button type="button" class="acc-head" aria-expanded="false">' +
                '<svg class="ic" viewBox="0 0 24 24">' + ICONS[s.icon] + '</svg>' +
                '<span class="t">' + s.title + '</span>' +
            '</button>' +
            '<div class="panel"><ul>' + items + '</ul></div>';

        var head = d.querySelector('.acc-head');
        var panel = d.querySelector('.panel');
        head.addEventListener('click', function () {
            var open = !d.classList.contains('open');
            d.classList.toggle('open', open);
            head.setAttribute('aria-expanded', open ? 'true' : 'false');
            panel.style.maxHeight = open ? panel.scrollHeight + 'px' : '0';
        });

        grid.appendChild(d);
    });
    tabs.forEach(function (t) { t.classList.toggle('active', t.dataset.tab === name); });
}
tabs.forEach(function (t) { t.addEventListener('click', function () { show(t.dataset.tab); }); });
show('technical');

window.addEventListener('resize', function () {
    document.querySelectorAll('.acc.open .panel').forEach(function (p) { p.style.maxHeight = p.scrollHeight + 'px'; });
});
</script>

</body>
</html>
